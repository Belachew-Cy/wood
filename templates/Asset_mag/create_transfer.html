{% extends "base.html" %}

{% block content %}

<div class="container-fluid py-4">

    <h3>Asset Transfer Request</h3>

    <p class="text-muted">
        Request the transfer of an asset to another department.
    </p>

    <div class="card shadow-sm p-4">

        <form method="POST">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <div class="mb-3">
                <label class="form-label">Select Asset</label>

                <select name="asset_id" class="form-select" required>
                    <option value="">Select Asset</option>

                    {% for asset in assets %}
                    <option value="{{ asset.id }}">
                        {{ asset.asset_code }} - {{ asset.name }}
                    </option>
                    {% endfor %}

                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Receiving Department</label>

                <select
                    name="to_department_id"
                    class="form-select"
                    required
                >
                    <option value="">Select Department</option>

                    {% for department in departments %}
                    <option value="{{ department.id }}">
                        {{ department.name }}
                    </option>
                    {% endfor %}

                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Transfer Reason</label>

                <textarea
                    name="reason"
                    class="form-control"
                    rows="4"
                    required
                    placeholder="Explain why this asset needs to be transferred."
                ></textarea>
            </div>

            <button type="submit" class="btn btn-success">
                Submit Transfer Request
            </button>

            <a
                href="{{ url_for('asset_management.asset_transfer_list') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
