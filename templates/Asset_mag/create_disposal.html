{% extends "base.html" %}

{% block content %}

<div class="container-fluid py-4">

    <h3>Asset Disposal Request</h3>

    <p class="text-muted">
        Submit an asset disposal or write-off request.
    </p>

    <div class="card shadow-sm p-4">

        <form method="POST">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <div class="mb-3">
                <label class="form-label">Select Asset</label>

                <select name="asset_id" class="form-select" required>
                    <option value="">Select Asset</option>

                    {% for asset in assets %}
                    <option value="{{ asset.id }}">
                        {{ asset.asset_code }} - {{ asset.name }}
                    </option>
                    {% endfor %}

                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Disposal Type</label>

                <select name="disposal_type" class="form-select" required>
                    <option value="">Select Disposal Type</option>
                    <option value="Sale">Sale</option>
                    <option value="Write-Off">Write-Off</option>
                    <option value="Scrapping">Scrapping</option>
                    <option value="Donation">Donation</option>
                    <option value="Loss">Loss</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Reason for Disposal</label>

                <textarea name="reason"
                          class="form-control"
                          rows="4"
                          required
                          placeholder="Explain why the asset should be disposed of."></textarea>
            </div>

            <button type="submit" class="btn btn-success">
                Submit Disposal Request
            </button>

            <a href="{{ url_for('asset_management.disposal_list') }}"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
